name: Play Market uchun yig'ish (AAB)

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: "Versiya raqami (har yuklashda oldingisidan katta bo'lsin)"
        required: true
        default: "10"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Android loyihasini yaratish
        run: |
          pip install --quiet pillow
          rm -rf play
          mkdir -p "$(dirname play/settings.gradle)"
          cat > play/settings.gradle <<'OTEOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "OchiqTanlov"
          include ":app"
          OTEOF
          mkdir -p "$(dirname play/build.gradle)"
          cat > play/build.gradle <<'OTEOF'
          plugins {
              id 'com.android.application' version '8.11.1' apply false
          }
          OTEOF
          mkdir -p "$(dirname play/gradle.properties)"
          cat > play/gradle.properties <<'OTEOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          OTEOF
          mkdir -p "$(dirname play/app/build.gradle)"
          cat > play/app/build.gradle <<'OTEOF'
          plugins {
              id 'com.android.application'
          }

          // Versiya raqami GitHub Actions'dan keladi (har yangi yuklashda oshiriladi)
          def vcode = (System.getenv('VCODE') ?: '10') as int

          android {
              namespace 'uz.ochiqtanlov.app'
              compileSdk 36

              defaultConfig {
                  applicationId 'uz.ochiqtanlov.app'
                  minSdk 24
                  targetSdk 36
                  versionCode vcode
                  versionName "${vcode}.0"
                  resValue 'string', 'ot_vcode', "${vcode}"
              }

              signingConfigs {
                  upload {
                      storeFile file(System.getenv('KS_FILE') ?: 'missing.p12')
                      storePassword System.getenv('KS_PASS') ?: ''
                      keyAlias 'upload'
                      keyPassword System.getenv('KS_PASS') ?: ''
                      storeType 'pkcs12'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.upload
                  }
              }

              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          OTEOF
          mkdir -p "$(dirname play/app/src/main/AndroidManifest.xml)"
          cat > play/app/src/main/AndroidManifest.xml <<'OTEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.camera.front" android:required="false" />

              <application
                  android:label="OchiqTanlov"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar"
                  android:enableOnBackInvokedCallback="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden|keyboard|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          OTEOF
          mkdir -p "$(dirname play/app/src/main/java/uz/ochiqtanlov/app/MainActivity.java)"
          cat > play/app/src/main/java/uz/ochiqtanlov/app/MainActivity.java <<'OTEOF'
          package uz.ochiqtanlov.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Insets;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowInsets;
          import android.view.WindowManager;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.window.OnBackInvokedDispatcher;

          /**
           * OchiqTanlov (Play Market versiyasi).
           * Ilova saytni ochadi, shuning uchun sayt yangilanishi bilan ilova ham yangilanadi.
           * - FLAG_SECURE: skrinshot va ekran yozuvi taqiqlangan
           * - kamera: Face ID va test nazorati uchun (sahifa so'raganda ruxsat beriladi)
           * - boshqa saytlar, Telegram, telefon va .apk havolalari telefonning o'z ilovalarida ochiladi
           */
          public class MainActivity extends Activity {
              private static final String HOST = "sunnatilloergashov100-spec.github.io";
              private static final int REQ_CAMERA = 1, REQ_FILE = 2;

              private WebView web;
              private PermissionRequest pendingPermission;
              private ValueCallback<Uri[]> fileCallback;

              private String startUrl() {
                  return "https://" + HOST + "/ochiqtanlov/?apk=" + getString(R.string.ot_vcode) + "&play=1";
              }

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE);

                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(0xFFF2F5F6);
                  web = new WebView(this);
                  root.addView(web, new FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));
                  setContentView(root);

                  // Android 15+ da ilova butun ekranni egallaydi: tizim panellari uchun joy qoldiramiz
                  root.setOnApplyWindowInsetsListener((View v, WindowInsets insets) -> {
                      if (Build.VERSION.SDK_INT >= 30) {
                          Insets i = insets.getInsets(WindowInsets.Type.systemBars() | WindowInsets.Type.displayCutout() | WindowInsets.Type.ime());
                          v.setPadding(i.left, i.top, i.right, i.bottom);
                          return WindowInsets.CONSUMED;
                      }
                      v.setPadding(insets.getSystemWindowInsetLeft(), insets.getSystemWindowInsetTop(),
                              insets.getSystemWindowInsetRight(), insets.getSystemWindowInsetBottom());
                      return insets.consumeSystemWindowInsets();
                  });

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(false);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri u = request.getUrl();
                          String url = u.toString();
                          if (HOST.equals(u.getHost()) && !url.endsWith(".apk")) return false;
                          openExternal(url);
                          return true;
                      }

                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          if (request.isForMainFrame()) {
                              String html = "<html><head><meta name='viewport' content='width=device-width,initial-scale=1'></head>"
                                      + "<body style='font-family:sans-serif;padding:32px;background:#F2F5F6;color:#13232C'>"
                                      + "<h2>Internet aloqasi yo'q</h2><p>OchiqTanlov ishlashi uchun internet kerak. Ulanishni tekshiring.</p>"
                                      + "<p><a href='" + startUrl() + "' style='display:inline-block;background:#0B7A62;color:#fff;padding:12px 18px;border-radius:8px;text-decoration:none'>Qayta urinish</a></p></body></html>";
                              view.loadDataWithBaseURL("https://" + HOST + "/", html, "text/html", "utf-8", null);
                          }
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(PermissionRequest request) {
                          runOnUiThread(() -> {
                              if (checkSelfPermission(Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) {
                                  request.grant(request.getResources());
                              } else {
                                  if (pendingPermission != null) pendingPermission.deny();
                                  pendingPermission = request;
                                  requestPermissions(new String[]{Manifest.permission.CAMERA}, REQ_CAMERA);
                              }
                          });
                      }

                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (fileCallback != null) fileCallback.onReceiveValue(null);
                          fileCallback = callback;
                          try {
                              startActivityForResult(params.createIntent(), REQ_FILE);
                          } catch (Exception e) {
                              fileCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  web.setDownloadListener((url, userAgent, contentDisposition, mimeType, length) -> openExternal(url));

                  if (Build.VERSION.SDK_INT >= 33) {
                      getOnBackInvokedDispatcher().registerOnBackInvokedCallback(OnBackInvokedDispatcher.PRIORITY_DEFAULT, this::goBackOrFinish);
                  }

                  if (state != null) web.restoreState(state);
                  else web.loadUrl(startUrl());
              }

              private void goBackOrFinish() {
                  if (web != null && web.canGoBack()) web.goBack();
                  else finish();
              }

              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  goBackOrFinish();
              }

              private void openExternal(String url) {
                  try {
                      startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                  } catch (Exception ignored) {
                  }
              }

              @Override
              public void onRequestPermissionsResult(int code, String[] permissions, int[] results) {
                  super.onRequestPermissionsResult(code, permissions, results);
                  if (code == REQ_CAMERA && pendingPermission != null) {
                      if (results.length > 0 && results[0] == PackageManager.PERMISSION_GRANTED) {
                          pendingPermission.grant(pendingPermission.getResources());
                      } else {
                          pendingPermission.deny();
                      }
                      pendingPermission = null;
                  }
              }

              @Override
              @SuppressWarnings("deprecation")
              protected void onActivityResult(int code, int result, Intent data) {
                  super.onActivityResult(code, result, data);
                  if (code == REQ_FILE && fileCallback != null) {
                      fileCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(result, data));
                      fileCallback = null;
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  if (web != null) web.saveState(out);
              }

              @Override
              protected void onDestroy() {
                  if (web != null) {
                      web.destroy();
                      web = null;
                  }
                  super.onDestroy();
              }
          }
          OTEOF
          cat > /tmp/icon.py <<'OTEOF'
          from PIL import Image, ImageDraw
          import math, os
          S=1024
          bg=Image.new("RGB",(S,S));px=bg.load()
          top,bot=(16,92,140),(8,46,84)
          for y in range(S):
              t=y/(S-1);c=tuple(int(top[i]*(1-t)+bot[i]*t) for i in range(3))
              for x in range(S):px[x,y]=c
          mask=Image.new("L",(S,S),0);ImageDraw.Draw(mask).rounded_rectangle([0,0,S-1,S-1],radius=int(S*0.22),fill=255)
          icon=Image.new("RGBA",(S,S),(0,0,0,0));icon.paste(bg,(0,0),mask)
          d=ImageDraw.Draw(icon);cx=cy=S*0.5;r=S*0.30;w=int(S*0.075)
          d.arc([cx-r,cy-r,cx+r,cy+r],start=-20,end=290,fill=(255,255,255,255),width=w)
          for ang in (-20,290):
              a=math.radians(ang);ex,ey=cx+(r-w/2)*math.cos(a),cy+(r-w/2)*math.sin(a)
              d.ellipse([ex-w/2,ey-w/2,ex+w/2,ey+w/2],fill=(255,255,255,255))
          gold=(255,196,61,255);pts=[(S*0.36,S*0.50),(S*0.47,S*0.61),(S*0.76,S*0.27)];cw=int(S*0.085)
          d.line(pts,fill=gold,width=cw,joint="curve")
          for p in (pts[0],pts[2]):d.ellipse([p[0]-cw/2,p[1]-cw/2,p[0]+cw/2,p[1]+cw/2],fill=gold)
          for n,s in {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}.items():
              o="play/app/src/main/res/mipmap-"+n;os.makedirs(o,exist_ok=True)
              icon.resize((s,s),Image.LANCZOS).save(o+"/ic_launcher.png")
          print("icons ok")
          OTEOF
          python3 /tmp/icon.py
          find play -type f | sort

      - name: Android SDK 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Imzo kaliti
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_B64" ]; then echo "::error::UPLOAD_KEYSTORE_B64 secret qo'shilmagan (Settings → Secrets and variables → Actions)"; exit 1; fi
          echo "$UPLOAD_KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/upload.p12"

      - name: Yig'ish (AAB + APK)
        working-directory: play
        env:
          VCODE: ${{ inputs.versionCode }}
          KS_FILE: ${{ runner.temp }}/upload.p12
          KS_PASS: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon bundleRelease assembleRelease

      - name: Natijani tayyorlash
        run: |
          mkdir out
          cp play/app/build/outputs/bundle/release/app-release.aab "out/OchiqTanlov-play-v${{ inputs.versionCode }}.aab"
          cp play/app/build/outputs/apk/release/app-release.apk "out/OchiqTanlov-play-v${{ inputs.versionCode }}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: OchiqTanlov-play-v${{ inputs.versionCode }}
          path: out/
